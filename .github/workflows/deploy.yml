name: Despliegue Productivo Protegido (Self-Hosted Runner + Environment Production)

# NOTA AWS ACADEMY: esta cuenta bloquea iam:CreateRole, iam:CreateOpenIDConnectProvider,
# iam:CreateUser y iam:UpdateAssumeRolePolicy (política Pvoclabs2), por lo que no es posible
# federar GitHub Actions vía OIDC ni usar un IAM user con Access Keys. Este workflow corre en
# un runner self-hosted (una máquina tuya) que ya tiene una sesión de AWS Academy Learner Lab
# válida en ~/.aws/credentials -- el mismo mecanismo que ya usas para el despliegue manual,
# solo que ahora el disparador es el push a main en vez de un comando manual.
#
# Requisito para que este workflow tenga éxito: la sesión de AWS Academy en la máquina runner
# debe seguir vigente (no expirada, <4h) en el momento en que corre. Si expiró, el job fallará
# en el paso "Verificar credenciales AWS Academy activas" con un mensaje claro.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno de destino'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

permissions:
  contents: read

# REGLA ARQUITECTÓNICA NFR32: Serialización estricta de despliegues
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  despliegue-produccion:
    name: Despliegue en AWS (Self-Hosted + Terraform + SAM + Ansible + Smoke Tests)
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production # Aprobación humana opcional -- ver nota en Settings > Environments

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-serverless/package-lock.json

      - name: 3. Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: 4. Configurar AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: 5. Verificar herramientas del runner (Ansible, AWS CLI)
        run: |
          command -v ansible-playbook >/dev/null || { echo "::error::ansible no está instalado en este runner (ej. 'sudo pacman -S ansible' en Arch)."; exit 1; }
          command -v aws >/dev/null || { echo "::error::aws CLI no está instalado en este runner."; exit 1; }

      # ── Credenciales AWS Academy (ya presentes en el runner, sin OIDC) ───────
      - name: 6. Verificar credenciales AWS Academy activas
        run: |
          aws sts get-caller-identity || {
            echo "::error::No hay credenciales AWS válidas en ~/.aws/credentials de este runner. Renueva la sesión de AWS Academy Learner Lab en esta máquina y vuelve a hacer push."
            exit 1
          }

      # ── Verificación Previa de Seguridad y Empaquetado ───────────────────────
      - name: 7. Instalar dependencias backend
        run: npm ci
        working-directory: backend-serverless

      - name: 8. Gate de verificación completa backend
        run: npm run verificar
        working-directory: backend-serverless

      # ── Paso 1: Aplicación de Infraestructura Base (Terraform) ───────────────
      - name: 9. Inicializar y Aplicar Terraform
        run: |
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_entorno: prod
          # AWS Academy bloquea cloudfront:CreateOriginAccessControl/CreateDistribution;
          # modo_academy=true usa el fallback de S3 Static Website (ver main.tf:57).
          TF_VAR_modo_academy: "true"

      - name: 10. Capturar Outputs obligatorios de Terraform (AD-8, AR-11)
        id: tf_outputs
        run: |
          echo "URL_FRONTEND=$(terraform output -raw url_frontend)" >> $GITHUB_ENV
          echo "BUCKET_FRONTEND=$(terraform output -raw nombre_bucket_frontend)" >> $GITHUB_ENV
          echo "BUCKET_MULTIMEDIA=$(terraform output -raw nombre_bucket_multimedia)" >> $GITHUB_ENV
          echo "BUCKET_DATALAKE=$(terraform output -raw nombre_bucket_datalake)" >> $GITHUB_ENV
          echo "NOMBRE_TABLA=$(terraform output -raw nombre_tabla_dynamodb)" >> $GITHUB_ENV
          echo "ARN_COLA_FOTOS=$(terraform output -raw arn_cola_fotos)" >> $GITHUB_ENV
          echo "ARN_DLQ_FOTOS=$(terraform output -raw arn_dlq_fotos)" >> $GITHUB_ENV
          echo "ARN_TEMA_ALARMAS=$(terraform output -raw arn_tema_alarmas)" >> $GITHUB_ENV
          echo "ID_CLOUDFRONT=$(terraform output -raw id_cloudfront || echo '')" >> $GITHUB_ENV

      # ── Paso 2: Despliegue de Cómputo y API (AWS SAM) ────────────────────────
      - name: 11. Compilar y Desplegar AWS SAM
        working-directory: backend-serverless
        run: |
          npm run sam:build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name "mision-emprende-prod" \
            --region us-east-1 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Entorno=prod \
              NombreTabla="${NOMBRE_TABLA}" \
              NombreBucketDatalake="${BUCKET_DATALAKE}" \
              BucketMultimedia="${BUCKET_MULTIMEDIA}" \
              ArnColaFotos="${ARN_COLA_FOTOS}" \
              ArnDlqFotos="${ARN_DLQ_FOTOS}" \
              ArnTemaAlarmas="${ARN_TEMA_ALARMAS}" \
              OrigenCors="${URL_FRONTEND}" \
              ModoDespliegue=academy

      - name: 12. Capturar URL de API Gateway
        working-directory: backend-serverless
        run: |
          URL_API=$(aws cloudformation describe-stacks --stack-name mision-emprende-prod --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='UrlApi'].OutputValue" --output text)
          echo "URL_API=${URL_API}" >> $GITHUB_ENV

      # ── Paso 3: Orquestación y Publicación Frontend (Ansible) ────────────────
      - name: 13. Publicar Frontend e Invalidar CDN (Ansible)
        run: |
          ansible-playbook ansible/deploy.yml \
            -e "url_api=${URL_API}" \
            -e "bucket_frontend=${BUCKET_FRONTEND}" \
            -e "id_cloudfront=${ID_CLOUDFRONT}" \
            -e "url_frontend=${URL_FRONTEND}" \
            -e "origen_cors=${URL_FRONTEND}" \
            -e "entorno=prod" \
            -e "modo_academy=true"
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote

      # ── Paso 4: Smoke Test Bloqueante (NFR23, NFR32) ─────────────────────────
      - name: 14. Ejecutar Smoke Test Bloqueante (Navegador -> API -> Lambda -> DynamoDB)
        working-directory: backend-serverless
        run: |
          npx tsx scripts/smoke-test.ts --url="${URL_API}"
        env:
          STRICT_SMOKE_TEST: "true"
