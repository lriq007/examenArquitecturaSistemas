AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend serverless de Mision Emprende UDD

Parameters:
  Entorno:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  NombreTabla:
    Type: String
    Default: MisionEmprende-prod
    Description: Nombre de la tabla DynamoDB creada por Terraform (Global Tables).

  NombreBucketDatalake:
    Type: String
    Description: Bucket S3 privado usado por Athena para datos y resultados.

  BucketMultimedia:
    Type: String
    Description: Bucket multimedia privado creado por Terraform.

  ArnColaFotos:
    Type: String
    Description: ARN de la cola principal de fotografías creada por Terraform.

  ArnDlqFotos:
    Type: String
    Description: ARN de la DLQ de fotografías creada por Terraform.

  ArnTemaAlarmas:
    Type: String
    Description: >
      ARN del tema SNS de alarmas operables creado por Terraform
      (AD-8: Terraform posee el tema; SAM solo lo referencia).

  OrigenCors:
    Type: String
    AllowedPattern: "https://.+|http://.+"
    Description: Dominio autorizado para consumir la API.

  OrigenCorsProductivoConfirmado:
    Type: String
    Default: https://academy.invalid
    AllowedPattern: "https://.+"
    Description: Confirmación HTTPS usada por Rules cuando el modo es productivo.

  DynamoDbEndpointLocal:
    Type: String
    Default: ""
    Description: >
      Endpoint de DynamoDB local (solo para sam local). Vacío en AWS real,
      donde el SDK usa el endpoint real de DynamoDB automáticamente.

  RegionDynamoPrincipal:
    Type: String
    Default: us-east-1
    Description: Region DynamoDB utilizada como principal por el backend.

  RegionDynamoRespaldo:
    Type: String
    Default: us-west-2
    Description: Region DynamoDB utilizada para failover.

  SimularFalloDynamoPrincipal:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Simula indisponibilidad de la replica DynamoDB principal.

  UmbralFallosBreaker:
    Type: String
    Default: "3"
    Description: >
      Cantidad de fallos consecutivos elegibles antes de abrir el Circuit
      Breaker de failover DynamoDB. Valor provisional, pendiente de
      calibración por prueba de carga (fuera de esta épica).

  DuracionCooldownMsBreaker:
    Type: String
    Default: "60000"
    Description: >
      Duración en milisegundos del cooldown del Circuit Breaker de
      failover DynamoDB mientras permanece ABIERTO. Valor provisional,
      pendiente de calibración por prueba de carga (fuera de esta épica).

  ModoDespliegue:
    Type: String
    Default: productivo
    AllowedValues: [productivo, academy]

  CargasFotografiasHabilitadas:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  CaosFotos:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Habilita el mecanismo de fallo controlado de la consumidora
      fotográfica. Sin CaosFotosTrabajoId fijado no provoca ningún
      fallo (Always: nunca afecta a toda la cola).

  CaosFotosTrabajoId:
    Type: String
    Default: ""
    Description: >
      trabajoId único acotado por el experimento de caos 6.5 cuando
      CaosFotos es "true". Vacío por defecto y reversible.

Conditions:
  EsAcademy: !Equals [!Ref ModoDespliegue, academy]
  EsProductivo: !Not [!Condition EsAcademy]

Rules:
  CorsSeguroSegunModo:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref ModoDespliegue, academy]
          - !Equals [!Ref OrigenCors, !Ref OrigenCorsProductivoConfirmado]
        AssertDescription: El modo productivo exige un origen CORS HTTPS.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 15
    Environment:
      Variables:
        NOMBRE_TABLA: !Ref NombreTabla
        COGNITO_PROFESORES_POOL_ID: !Ref PoolProfesores
        COGNITO_PROFESORES_CLIENT_ID: !Ref ClienteProfesores
        COGNITO_GRUPOS_POOL_ID: !Ref PoolGrupos
        COGNITO_GRUPOS_CLIENT_ID: !Ref ClienteGrupos
        ORIGEN_CORS: !Ref OrigenCors
        ENTORNO: !Ref Entorno
        DYNAMODB_ENDPOINT: !Ref DynamoDbEndpointLocal
        DYNAMODB_REGION_PRINCIPAL: !Ref RegionDynamoPrincipal
        DYNAMODB_REGION_RESPALDO: !Ref RegionDynamoRespaldo
        SIMULAR_FALLO_DYNAMODB_PRINCIPAL: !Ref SimularFalloDynamoPrincipal
        UMBRAL_FALLOS_BREAKER: !Ref UmbralFallosBreaker
        DURACION_COOLDOWN_MS_BREAKER: !Ref DuracionCooldownMsBreaker
        CARGAS_FOTOGRAFIAS_HABILITADAS: !Ref CargasFotografiasHabilitadas

  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref OrigenCors
      AllowHeaders:
        - Authorization
        - Content-Type
      AllowMethods:
        - GET
        - POST
        - OPTIONS
      MaxAge: 600

Resources:
  ApiBackend:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      RouteSettings:
        "POST /api/acceso/ingresar":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "POST /api/profesor/ingresar":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      Auth:
        DefaultAuthorizer: AuthorizerGrupos
        Authorizers:
          AuthorizerProfesores:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${PoolProfesores}"
              audience:
                - !Ref ClienteProfesores
            IdentitySource: "$request.header.Authorization"
          AuthorizerGrupos:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${PoolGrupos}"
              audience:
                - !Ref ClienteGrupos
            IdentitySource: "$request.header.Authorization"

  PoolProfesores:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "mision-emprende-${Entorno}-profesores"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  GrupoProfesores:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: PROFESOR
      UserPoolId: !Ref PoolProfesores

  ClienteProfesores:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PoolProfesores
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  PoolGrupos:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "mision-emprende-${Entorno}-grupos"
      Schema:
        - Name: grupoId
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  GrupoGrupos:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: GRUPO
      UserPoolId: !Ref PoolGrupos

  ClienteGrupos:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PoolGrupos
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH]
      AccessTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours

  PoliticaDynamoGlobal:
    Type: AWS::IAM::ManagedPolicy
    Condition: EsProductivo
    Properties:
      Description: Acceso acotado a la Global Table y sus índices en ambas regiones.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:BatchWriteItem
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:TransactWriteItems
              - dynamodb:UpdateItem
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoPrincipal}:${AWS::AccountId}:table/${NombreTabla}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoPrincipal}:${AWS::AccountId}:table/${NombreTabla}/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoRespaldo}:${AWS::AccountId}:table/${NombreTabla}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoRespaldo}:${AWS::AccountId}:table/${NombreTabla}/index/*"

  RolSesionesProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolAccesoProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: CognitoIngresoGrupo
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: cognito-idp:AdminInitiateAuth
            Resource:
              Fn::GetAtt:
              - PoolGrupos
              - Arn
  RolProfesorProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: CognitoGestionGrupos
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminUpdateUserAttributes
            Resource:
              Fn::GetAtt:
              - PoolGrupos
              - Arn
  RolFase1Productivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolFase2Productivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolFase3Productivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolFase4Productivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolFase5Productivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
  RolAnalyticsProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: ConsultasAthena
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - athena:GetQueryExecution
            - athena:GetQueryResults
            - athena:StartQueryExecution
            Resource: '*'
          - Effect: Allow
            Action:
            - glue:GetDatabase
            - glue:GetDatabases
            - glue:GetTable
            - glue:GetTables
            - glue:GetPartitions
            Resource: '*'
          - Effect: Allow
            Action:
            - s3:GetBucketLocation
            - s3:ListBucket
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${NombreBucketDatalake}
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${NombreBucketDatalake}/*
  RolFotografiasApiProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: CargaFotografias
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${BucketMultimedia}/entradas/*
  RolConsumidorFotografiasProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: ConsumoFotografias
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${BucketMultimedia}/entradas/*
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Ref: ArnColaFotos
  RolReconciliadorFotografiasProductivo:
    Type: AWS::IAM::Role
    Condition: EsProductivo
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - Ref: PoliticaDynamoGlobal
      Policies:
      - PolicyName: ConsumoDlqFotografias
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Ref: ArnDlqFotos
  FuncionAcceso:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [EsAcademy, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole", !GetAtt RolAccesoProductivo.Arn]
      CodeUri: .
      Handler: src/acceso/api.manejador
      ReservedConcurrentExecutions: 10
      Events:
        Ingresar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/acceso/ingresar
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/acceso/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionProfesor:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [EsAcademy, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole", !GetAtt RolProfesorProductivo.Arn]
      CodeUri: .
      Handler: src/profesor/api.manejador
      Timeout: 300
      ReservedConcurrentExecutions: 5
      Events:
        IngresarProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/ingresar
            Method: POST
            Auth:
              Authorizer: NONE
        ListarSesionesProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: GET
            Auth:
              Authorizer: AuthorizerProfesores
        CrearSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: POST
            Auth:
              Authorizer: AuthorizerProfesores
        ObtenerSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}
            Method: GET
            Auth:
              Authorizer: AuthorizerProfesores
        AccionesSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}/acciones
            Method: POST
            Auth:
              Authorizer: AuthorizerProfesores
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/profesor/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionSesiones:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [EsAcademy, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole", !GetAtt RolSesionesProductivo.Arn]
      CodeUri: .
      Handler: src/sesiones/api.manejador
      Events:
        ObtenerSesionActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/sesiones/actual
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/sesiones/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

