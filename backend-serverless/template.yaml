        EstadoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/estado
            Method: GET
        IniciarFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/iniciar
            Method: POST
        ModoEquipoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/modo-equipo
            Method: POST
        ListoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/listo
            Method: POST
        FinalizarConocidosFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/finalizar-conocidos
            Method: POST
        PalabrasFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/palabras
            Method: POST
        CompletarFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
