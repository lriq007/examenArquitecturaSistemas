  # AWS Academy no permite crear roles/policies IAM. Estas funciones reutilizan
  AlarmaErroresConsumidorFotos:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Cualquier error del bulkhead consumidor de fotografías (dispara en
        la primera ocurrencia: EvaluationPeriods=1/Threshold=0, sensibilidad
        provisional pendiente de calibración por prueba de carga).
        Diagnóstico: revisar CloudWatch Logs de FuncionConsumidorFotografias
        y el estado de la DLQ (AlarmaFotografiasDlq en Terraform) antes de redrivar.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref FuncionConsumidorFotografias }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ArnTemaAlarmas]

  AlarmaErroresAnalytics:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Cualquier error del bulkhead Analytics (consultas Athena; dispara en
        la primera ocurrencia: EvaluationPeriods=1/Threshold=0, sensibilidad
        provisional pendiente de calibración por prueba de carga).
        Diagnóstico: revisar CloudWatch Logs de FuncionAnalytics y el
        estado del workgroup/consulta Athena antes de reintentar.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref FuncionAnalytics }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ArnTemaAlarmas]

  AlarmaAutenticacionAnomala:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Señal aproximada de autenticación anómala: esta alarma mide la
        tasa agregada de 4xx de TODA la API (ApiBackend), no un
        indicador específico de autenticación — el JWT Authorizer nativo
        de API Gateway HTTP API no expone una métrica propia de
        401/403. Se usa como proxy amplio mientras no exista una señal
        más precisa. Umbral provisional, pendiente de calibración por
        prueba de carga (fuera de esta épica). Diagnóstico: revisar
        CloudWatch Logs de ApiBackend y los intentos fallidos en los
        User Pools de Cognito (PoolProfesores/PoolGrupos) para el mismo
        período, para distinguir 4xx de autenticación de otros 4xx de
        validación de negocio.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions: [{ Name: ApiId, Value: !Ref ApiBackend }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ArnTemaAlarmas]

Outputs:
  UrlApi:
    Description: URL publica de API Gateway
    Value: !Sub "https://${ApiBackend}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  NombreTabla:
    Description: Nombre de la tabla DynamoDB (creada por Terraform)
    Value: !Ref NombreTabla

  PoolProfesoresId:
    Value: !Ref PoolProfesores

  ClienteProfesoresId:
    Value: !Ref ClienteProfesores

  PoolGruposId:
    Value: !Ref PoolGrupos

  ClienteGruposId:
    Value: !Ref ClienteGrupos
