    Properties:
      Role: !If [EsAcademy, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole", !GetAtt RolFase3Productivo.Arn]
      CodeUri: .
      Handler: src/fase3/api.manejador
      Events:
        EstadoFase3:
