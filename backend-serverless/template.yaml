        IniciarFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/iniciar
            Method: POST
        ListoFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
