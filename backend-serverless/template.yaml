AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend serverless de Mision Emprende UDD

Parameters:
  Entorno:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  NombreTabla:
    Type: String
    Default: MisionEmprende-prod
    Description: Nombre de la tabla DynamoDB creada por Terraform (Global Tables).

  NombreBucketDatalake:
    Type: String
    Description: Bucket S3 privado usado por Athena para datos y resultados.

  OrigenCors:
    Type: String
    AllowedPattern: "https://.+|http://localhost(:[0-9]+)?"
    Description: Dominio autorizado para consumir la API.

  DynamoDbEndpointLocal:
    Type: String
    Default: ""
    Description: >
      Endpoint de DynamoDB local (solo para sam local). Vacío en AWS real,
      donde el SDK usa el endpoint real de DynamoDB automáticamente.

  RegionDynamoPrincipal:
    Type: String
    Default: us-east-1
    Description: Region DynamoDB utilizada como principal por el backend.

  RegionDynamoRespaldo:
    Type: String
    Default: us-west-2
    Description: Region DynamoDB utilizada para failover.

  SimularFalloDynamoPrincipal:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Simula indisponibilidad de la replica DynamoDB principal.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 15
    Environment:
      Variables:
        NOMBRE_TABLA: !Ref NombreTabla
        COGNITO_PROFESORES_POOL_ID: !Ref PoolProfesores
        COGNITO_PROFESORES_CLIENT_ID: !Ref ClienteProfesores
        COGNITO_GRUPOS_POOL_ID: !Ref PoolGrupos
        COGNITO_GRUPOS_CLIENT_ID: !Ref ClienteGrupos
        ORIGEN_CORS: !Ref OrigenCors
        ENTORNO: !Ref Entorno
        DYNAMODB_ENDPOINT: !Ref DynamoDbEndpointLocal
        DYNAMODB_REGION_PRINCIPAL: !Ref RegionDynamoPrincipal
        DYNAMODB_REGION_RESPALDO: !Ref RegionDynamoRespaldo
        SIMULAR_FALLO_DYNAMODB_PRINCIPAL: !Ref SimularFalloDynamoPrincipal

  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref OrigenCors
      AllowHeaders:
        - Authorization
        - Content-Type
      AllowMethods:
        - GET
        - POST
        - OPTIONS
      MaxAge: 600

Resources:
  ApiBackend:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      RouteSettings:
        "POST /api/acceso/ingresar":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "POST /api/profesor/ingresar":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      Auth:
        DefaultAuthorizer: AuthorizerGrupos
        Authorizers:
          AuthorizerProfesores:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${PoolProfesores}"
              audience:
                - !Ref ClienteProfesores
            IdentitySource: "$request.header.Authorization"
          AuthorizerGrupos:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${PoolGrupos}"
              audience:
                - !Ref ClienteGrupos
            IdentitySource: "$request.header.Authorization"

  PoolProfesores:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "mision-emprende-${Entorno}-profesores"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  GrupoProfesores:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: PROFESOR
      UserPoolId: !Ref PoolProfesores

  ClienteProfesores:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PoolProfesores
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  PoolGrupos:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "mision-emprende-${Entorno}-grupos"
      Schema:
        - Name: grupoId
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  GrupoGrupos:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: GRUPO
      UserPoolId: !Ref PoolGrupos

  ClienteGrupos:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PoolGrupos
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH]
      AccessTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours

  PoliticaDynamoGlobal:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Acceso acotado a la Global Table y sus índices en ambas regiones.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:BatchWriteItem
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:TransactWriteItems
              - dynamodb:UpdateItem
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoPrincipal}:${AWS::AccountId}:table/${NombreTabla}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoPrincipal}:${AWS::AccountId}:table/${NombreTabla}/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoRespaldo}:${AWS::AccountId}:table/${NombreTabla}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${RegionDynamoRespaldo}:${AWS::AccountId}:table/${NombreTabla}/index/*"

  FuncionAcceso:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/acceso/api.manejador
      ReservedConcurrentExecutions: 10
      Policies:
        - !Ref PoliticaDynamoGlobal
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminInitiateAuth
              Resource: !GetAtt PoolGrupos.Arn
      Events:
        Ingresar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/acceso/ingresar
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/acceso/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionProfesor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/profesor/api.manejador
      Timeout: 300
      ReservedConcurrentExecutions: 5
      Policies:
        - !Ref PoliticaDynamoGlobal
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt PoolGrupos.Arn
      Events:
        IngresarProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/ingresar
            Method: POST
            Auth:
              Authorizer: NONE
        ListarSesionesProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: GET
            Auth:
              Authorizer: AuthorizerProfesores
        CrearSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: POST
            Auth:
              Authorizer: AuthorizerProfesores
        ObtenerSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}
            Method: GET
            Auth:
              Authorizer: AuthorizerProfesores
        AccionesSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}/acciones
            Method: POST
            Auth:
              Authorizer: AuthorizerProfesores
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/profesor/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionSesiones:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/sesiones/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        ObtenerSesionActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/sesiones/actual
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/sesiones/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionFase1:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase1/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        EstadoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/estado
            Method: GET
        IniciarFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/iniciar
            Method: POST
        ModoEquipoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/modo-equipo
            Method: POST
        ListoFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/listo
            Method: POST
        FinalizarConocidosFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/finalizar-conocidos
            Method: POST
        PalabrasFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/palabras
            Method: POST
        CompletarFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/completar
            Method: POST
        RankingFase1:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/ranking
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/fase1/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionFase2:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase2/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        EstadoFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/estado
            Method: GET
        IniciarFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/iniciar
            Method: POST
        ListoFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/listo
            Method: POST
        SeleccionFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/seleccion
            Method: POST
        AsignarAzarFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/asignar-azar
            Method: POST
        GuardarBubbleMapFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/bubblemap/guardar
            Method: POST
        CompletarBubbleMapFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/bubblemap/completar
            Method: POST
        RankingFase2:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase2/ranking
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/fase2/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionFase3:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase3/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        EstadoFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/estado
            Method: GET
        IniciarFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/iniciar
            Method: POST
        ListoFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/listo
            Method: POST
        CompletarLegoFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/lego/completar
            Method: POST
        GirarRuletaFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/ruleta/girar
            Method: POST
        ResponderAstronautaFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/astronauta/responder
            Method: POST
        RankingFase3:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase3/ranking
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/fase3/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs
  FuncionFase4:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase4/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        EstadoFase4:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase4/estado
            Method: GET
        ListoFase4:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase4/listo
            Method: POST
        GuardarPitchFase4:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase4/pitch/guardar
            Method: POST
        IniciarPitchFase4:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase4/pitch/iniciar
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/fase4/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionFase5:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase5/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
      Events:
        EstadoFase5:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase5/estado
            Method: GET
        EvaluarFase5:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase5/evaluar
            Method: POST
        RankingFase5:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase5/ranking
            Method: GET
        RankingListoFase5:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase5/ranking/listo
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/fase5/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs


  FuncionAnalytics:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/analytics/api.manejador
      Policies:
        - !Ref PoliticaDynamoGlobal
        - Statement:
            - Effect: Allow
              Action:
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StartQueryExecution
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:GetPartitions
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:ListBucket
              Resource: !Sub "arn:${AWS::Partition}:s3:::${NombreBucketDatalake}"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${NombreBucketDatalake}/*"
      Timeout: 30
      Environment:
        Variables:
          ATHENA_DATABASE: "mision_emprende_db"
          ATHENA_WORKGROUP: !Sub "mision-emprende-${Entorno}-${AWS::AccountId}-workgroup"
      Events:
        ObtenerKpis:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/analytics/kpis/{sesionId}
            Method: GET
            Auth:
              Authorizer: AuthorizerProfesores
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/analytics/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

Outputs:
  UrlApi:
    Description: URL publica de API Gateway
    Value: !Sub "https://${ApiBackend}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  NombreTabla:
    Description: Nombre de la tabla DynamoDB (creada por Terraform)
    Value: !Ref NombreTabla

  PoolProfesoresId:
    Value: !Ref PoolProfesores

  ClienteProfesoresId:
    Value: !Ref ClienteProfesores

  PoolGruposId:
    Value: !Ref PoolGrupos

  ClienteGruposId:
    Value: !Ref ClienteGrupos
