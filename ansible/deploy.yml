---
# Playbook de despliegue — Misión Emprende UDD
# Uso: ansible-playbook ansible/deploy.yml -e "url_api=<URL> bucket_frontend=<BUCKET>"
#
# Variables requeridas (pasar con -e o definir en group_vars):
#   url_api:         URL del API Gateway (obtenida del output de Terraform/SAM)
#   bucket_frontend: Nombre del bucket S3 del frontend (output de Terraform)
#   bucket_datalake: Nombre del bucket S3 de Athena (output de Terraform)
#   id_cloudfront:   ID de la distribución CloudFront (output de Terraform)
#   url_frontend:    URL HTTPS de CloudFront (output de Terraform)
#
# Variables opcionales:
#   entorno:         "prod" (default)
#   region:          "us-east-1" (default)
#   origen_cors:     Origen HTTPS exacto del frontend.

- name: Despliegue de Misión Emprende UDD
  hosts: localhost
  gather_facts: true

  vars:
    entorno: "prod"
    region: "us-east-1"
    nombre_tabla: "MisionEmprende-prod"
    modo_academy: false
    directorio_backend: "{{ playbook_dir }}/../backend-serverless"
    directorio_frontend: "{{ playbook_dir }}/../frontend"
    directorio_terraform: "{{ playbook_dir }}/.."

  pre_tasks:
    - name: Exigir origen CORS coherente con el modo
      assert:
        that:
          - origen_cors is defined
          - (modo_academy | bool and origen_cors is match('^http://')) or (not (modo_academy | bool) and origen_cors is match('^https://'))
        fail_msg: "Define origen_cors con HTTP solo para Academy o HTTPS para productivo."

    - name: Aprobar retención antes de cualquier mutación
      assert:
        that: not (habilitar_cargas_fotografias | default(false) | bool) or (politica_retencion_fotografias_aprobada | default(false) | bool)

    - name: Instalar dependencias para gates previos
      command: npm ci
      args: { chdir: "{{ directorio_backend }}" }
      changed_when: false

    - name: Gate backend completo previo
      command: npm run verificar
      args: { chdir: "{{ directorio_backend }}" }
      changed_when: false

    - name: Gate build SAM previo
      command: npm run sam:build
      args: { chdir: "{{ directorio_backend }}" }
      changed_when: false

    - name: Gate formato Terraform previo
      command: terraform fmt -check -recursive
      args: { chdir: "{{ directorio_terraform }}" }
      changed_when: false

    - name: Inicializar y validar Terraform previo
      shell: terraform init -backend=false && terraform validate
      args: { chdir: "{{ directorio_terraform }}" }
      changed_when: false

    - name: Gate sintaxis del playbook sin recursión
      command: ansible-playbook --syntax-check "{{ playbook_dir }}/deploy.yml" -i "{{ playbook_dir }}/inventory/hosts.yml"
      environment: { ANSIBLE_LOCAL_TEMP: /tmp/ansible-local, ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote }
      changed_when: false

  tasks:
    # ──────────────────────────────────────────────────────────────
    # 1. Verificar prerequisitos
    # ──────────────────────────────────────────────────────────────
    - name: Verificar que Node.js está instalado
      command: node --version
      register: node_version
      changed_when: false

    - name: Mostrar versión de Node.js
      debug:
        msg: "Node.js: {{ node_version.stdout }}"

    - name: Verificar que AWS SAM CLI está instalado
      command: sam --version
      register: sam_version
      changed_when: false

    - name: Mostrar versión de SAM
      debug:
        msg: "AWS SAM: {{ sam_version.stdout }}"

    - name: Verificar que AWS CLI está configurado
      command: aws sts get-caller-identity --region "{{ region }}"
      register: aws_identity
      changed_when: false

    - name: Inicializar Terraform sin backend remoto
      command: terraform init -backend=false
      args: { chdir: "{{ directorio_terraform }}" }
      changed_when: false

    - name: Aplicar infraestructura Terraform
      command: >
        terraform apply -auto-approve
        -var entorno={{ entorno }}
        -var nombre_tabla={{ nombre_tabla }}
        -var habilitar_cargas_fotografias={{ habilitar_cargas_fotografias | default(false) | bool | lower }}
        -var modo_academy={{ modo_academy | bool | lower }}
      args: { chdir: "{{ directorio_terraform }}" }
      changed_when: true

    - name: Leer outputs obligatorios de Terraform
      command: terraform output -json
      args: { chdir: "{{ directorio_terraform }}" }
      register: terraform_outputs
      changed_when: false

    - name: Conectar outputs Terraform con SAM y frontend
      set_fact:
        bucket_frontend: "{{ (terraform_outputs.stdout | from_json).nombre_bucket_frontend.value }}"
        bucket_multimedia: "{{ (terraform_outputs.stdout | from_json).nombre_bucket_multimedia.value }}"
        bucket_datalake: "{{ (terraform_outputs.stdout | from_json).nombre_bucket_datalake.value }}"
        arn_cola_fotos: "{{ (terraform_outputs.stdout | from_json).arn_cola_fotos.value }}"
        arn_dlq_fotos: "{{ (terraform_outputs.stdout | from_json).arn_dlq_fotos.value }}"
        arn_tema_alarmas: "{{ (terraform_outputs.stdout | from_json).arn_tema_alarmas.value }}"
        cargas_fotografias_habilitadas: "{{ (terraform_outputs.stdout | from_json).cargas_fotografias_habilitadas.value }}"
        id_cloudfront: "{{ (terraform_outputs.stdout | from_json).id_cloudfront.value }}"
        url_frontend: "{{ (terraform_outputs.stdout | from_json).url_frontend.value }}"

    - name: Validar outputs y aprobación de retención
      assert:
        that:
          - bucket_multimedia | length > 0
          - arn_cola_fotos | length > 0
          - arn_dlq_fotos | length > 0
          - (modo_academy | bool and url_frontend is match('^http://')) or (not (modo_academy | bool) and url_frontend is match('^https://'))
          - (origen_cors | regex_replace('/+$', '')) == (url_frontend | regex_replace('/+$', ''))
          - not (cargas_fotografias_habilitadas | bool) or (politica_retencion_fotografias_aprobada | default(false) | bool)
        fail_msg: "Faltan outputs Terraform o se intentó habilitar cargas sin política de retención aprobada."

    - name: Mostrar identidad AWS
      debug:
        msg: "Cuenta AWS: {{ aws_identity.stdout }}"

    # ──────────────────────────────────────────────────────────────
    # 2. Construir backend (SAM build)
    # ──────────────────────────────────────────────────────────────
    - name: Instalar dependencias Node.js del backend
      command: npm ci
      args:
        chdir: "{{ directorio_backend }}"
      changed_when: true

    - name: Construir Lambdas con SAM (sam build)
      command: npm run sam:build
      args:
        chdir: "{{ directorio_backend }}"
      register: sam_build_result
      changed_when: true

    - name: Ejecutar gates de tipos, pruebas, empaquetado y SAM
      command: npm run verificar
      args:
        chdir: "{{ directorio_backend }}"
      changed_when: false

    - name: Mostrar resultado de sam build
      debug:
        msg: "{{ sam_build_result.stdout_lines[-3:] }}"

    # ──────────────────────────────────────────────────────────────
    # 3. Desplegar backend en AWS (SAM deploy)
    # ──────────────────────────────────────────────────────────────
    - name: Desplegar backend con SAM (sam deploy)
      command: >
        sam deploy
        --stack-name mision-emprende-{{ entorno }}
        --region {{ region }}
        --capabilities CAPABILITY_IAM
        --resolve-s3
        --no-confirm-changeset
        --parameter-overrides
          "Entorno={{ entorno }}"
          "NombreTabla={{ nombre_tabla }}"
          "NombreBucketDatalake={{ bucket_datalake }}"
          "BucketMultimedia={{ bucket_multimedia }}"
          "ArnColaFotos={{ arn_cola_fotos }}"
          "ArnDlqFotos={{ arn_dlq_fotos }}"
          "ArnTemaAlarmas={{ arn_tema_alarmas }}"
          "OrigenCors={{ origen_cors }}"
          "OrigenCorsProductivoConfirmado={{ 'https://academy.invalid' if (modo_academy | bool) else origen_cors }}"
          "ModoDespliegue={{ 'academy' if (modo_academy | bool) else 'productivo' }}"
          "CargasFotografiasHabilitadas={{ cargas_fotografias_habilitadas | bool | lower }}"
      args:
        chdir: "{{ directorio_backend }}"
      register: sam_deploy_result
      changed_when: true

    - name: Mostrar resultado de sam deploy
      debug:
        msg: "{{ sam_deploy_result.stdout_lines[-10:] }}"

    # ──────────────────────────────────────────────────────────────
    # 4. Obtener URL de API Gateway desde los outputs de CloudFormation
    # ──────────────────────────────────────────────────────────────
    - name: Obtener outputs del stack CloudFormation
      command: >
        aws cloudformation describe-stacks
        --stack-name mision-emprende-{{ entorno }}
        --region {{ region }}
        --query "Stacks[0].Outputs"
        --output json
      register: cf_outputs
      changed_when: false

    - name: Extraer URL de API Gateway
      set_fact:
        url_api_gateway: >-
          {{ (cf_outputs.stdout | from_json
              | selectattr('OutputKey', 'equalto', 'UrlApi')
              | list | first).OutputValue }}
      when: url_api is not defined

    - name: Usar URL de API provista manualmente
      set_fact:
        url_api_gateway: "{{ url_api }}"
      when: url_api is defined

    - name: Mostrar URL de API Gateway
      debug:
        msg: "API Gateway URL: {{ url_api_gateway }}"

    # ──────────────────────────────────────────────────────────────
    # 5. Actualizar configuración del frontend con la URL real
    # ──────────────────────────────────────────────────────────────
    - name: Actualizar URL de API en el frontend
      lineinfile:
        path: "{{ directorio_frontend }}/compartido/js/api.js"
        regexp: "^(const|let|var)\\s+API_URL\\s*="
        line: "const API_URL = '{{ url_api_gateway }}';"
        create: false

    - name: Verificar si existe api.js en compartido
      stat:
        path: "{{ directorio_frontend }}/compartido/js/api.js"
      register: api_js

    - name: Advertencia si api.js no existe
      debug:
        msg: >
          ADVERTENCIA: No se encontró frontend/compartido/api.js.
          Actualiza manualmente la URL de API: {{ url_api_gateway }}
      when: not api_js.stat.exists

    # ──────────────────────────────────────────────────────────────
    # 6. Subir frontend a S3
    # ──────────────────────────────────────────────────────────────
    - name: Sincronizar frontend con S3
      command: >
        aws s3 sync {{ directorio_frontend }}/
        s3://{{ bucket_frontend }}/
        --region {{ region }}
        --delete
        --exclude "*.DS_Store"
        --exclude "node_modules/*"
      register: s3_sync_result
      changed_when: true

    - name: Mostrar archivos subidos
      debug:
        msg: "{{ s3_sync_result.stdout_lines[-5:] }}"

    # ──────────────────────────────────────────────────────────────
    # 7. Invalidar caché de CloudFront
    # ──────────────────────────────────────────────────────────────
    - name: Invalidar caché de CloudFront
      command: >
        aws cloudfront create-invalidation
        --distribution-id {{ id_cloudfront }}
        --paths "/*"
        --region us-east-1
      register: cf_invalidation
      changed_when: true
      when: id_cloudfront is defined and id_cloudfront | length > 0

    # ──────────────────────────────────────────────────────────────
    # 8. Verificación final
    # ──────────────────────────────────────────────────────────────
    - name: Verificar que el endpoint de API Gateway responde
      uri:
        url: "{{ url_api_gateway }}/api/sesiones/actual"
        method: GET
        status_code: [200, 401, 403]
        timeout: 15
      register: api_check

    - name: Resultado de verificación de API
      debug:
        msg: >-
          API status: {{ api_check.status | default('Sin respuesta') }}.
          {% if api_check.status in [200, 401, 403] %}
          ✓ API responde correctamente.
          {% else %}
          ✗ La API no responde. Verificar despliegue.
          {% endif %}

    # ──────────────────────────────────────────────────────────────
    # 9. Resumen final
    # ──────────────────────────────────────────────────────────────
    - name: Resumen del despliegue
      debug:
        msg:
          - "══════════════════════════════════════════════"
          - " Despliegue completado — Misión Emprende UDD"
          - "══════════════════════════════════════════════"
          - " Entorno   : {{ entorno }}"
          - " Región    : {{ region }}"
          - " Tabla DB  : {{ nombre_tabla }}"
          - " API URL   : {{ url_api_gateway }}"
          - " Frontend  : {{ url_frontend }}"
          - "══════════════════════════════════════════════"
